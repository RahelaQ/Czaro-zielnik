<!doctype html>
<html lang="pl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#EAE4DA" />
    <meta name="description" content="Zielnik ziół polskich — tradycja ludowa, kalendarz zbioru, rozpoznawanie roślin. Działa bez zasięgu." />

    <!-- Wyglada i zachowuje sie jak appka po dodaniu do ekranu glownego iPhone'a -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Czaro-Zielnik" />

    <title>Czaro-Zielnik</title>

    <!--
      Fonty byly wczytywane przez @import na gorze styles.css, co blokuje
      renderowanie: w lesie bez zasiegu przegladarka czekala na timeout, zanim
      w ogole cokolwiek narysowala. Teraz laduja sie rownolegle i nie wstrzymuja
      pierwszego malowania — a service worker trzyma je w cache na potem.
    -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;0,600;1,400&family=Inter:ital,wght@0,400;0,500;0,600;1,400&display=swap"
      media="print"
      onload="this.media='all'"
    />

    <script>
      // Motyw ustawiamy PRZED pierwszym malowaniem. Inaczej appka mrugnelaby
      // jasnym tlem, zanim React zdazy wstac — w nocy w lesie to prosto w oczy.
      (function () {
        try {
          var saved = localStorage.getItem("czaro-theme"); // "light" | "dark" | null (= systemowy)
          if (saved === "light" || saved === "dark") {
            document.documentElement.setAttribute("data-theme", saved);
          }
          var isDark =
            saved === "dark" ||
            (saved !== "light" &&
              window.matchMedia("(prefers-color-scheme: dark)").matches);
          var meta = document.querySelector('meta[name="theme-color"]');
          if (meta) meta.setAttribute("content", isDark ? "#313531" : "#EAE4DA");
        } catch (e) {
          // Tryb prywatny Safari potrafi rzucic przy localStorage —
          // appka ma wtedy po prostu isc systemowym motywem.
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
